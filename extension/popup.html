<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><style>
  body { width: 240px; margin: 0; background: #17131e; color: #eae5f2; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; }
  .wrap { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .line { display: flex; justify-content: space-between; font-size: 12px; color: #b9afc9; margin: 5px 0; }
  .ok { color: #6fe0a0; } .bad { color: #ff7b8c; }
  button { width: 100%; margin-top: 8px; background: #c9a84c; color: #1a1206; border: 0; border-radius: 7px; padding: 7px 10px; font-weight: 800; cursor: pointer; }
  .switch { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 36px; height: 21px; border-radius: 11px; background: #3a3048; position: relative; transition: background .2s; flex: 0 0 auto; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked + .track { background: #c9a84c; }
  .switch input:checked + .track .thumb { transform: translateX(15px); }
  .switch .label { display: flex; flex-direction: column; font-size: 12px; color: #eae5f2; line-height: 1.3; }
  .switch .label i { font-style: normal; font-size: 10px; color: #8a7f9a; }
  button.ghost { background: #2a2333; color: #d9d0e6; border: 1px solid #3a3048; }
</style></head>
<body>
  <div class="wrap">
    <h1>墨墨 · Murdoku</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="track"><span class="thumb"></span></span>
      <span class="label"><b>启用墨墨</b><i id="enabledState">…</i></span>
    </label>
    <div class="line"><span>API Key</span><span id="key">…</span></div>
    <div class="line"><span>模式</span><span id="mode">…</span></div>
    <div class="line"><span>日志</span><span id="logs">…</span></div>
    <button id="openOptions">打开设置 / 日志</button>
    <button id="reloadExt" class="ghost">重新加载扩展</button>
    <button id="openPuzzle" class="ghost">打开 Murdoku</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
